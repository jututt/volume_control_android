plugins {
    id 'com.android.application'
}

android {
    // REQUIRED: Must match your applicationId for modern Gradle versions
    namespace "com.example.punksta.volumecontrol" 
    
    // Updated to a modern SDK baseline compatible with Gradle 8
    compileSdkVersion 33 

    defaultConfig {
        applicationId "com.jututt.volumecontrol"
        minSdkVersion 21 // Bumped from 15 to 21 to support modern library versions
        targetSdkVersion 33
        versionCode 32
        versionName "2.6.1"

        // YOUR ORIGINAL REQUEST: Removes all languages except English
        resConfigs "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Updated to the optimized standard filename
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        // Modern Gradle toolchains require Java 11 or higher to build
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Modern syntax replacing the legacy lintOptions block
    lint {
        disable += ['GoogleAppIndexingWarning']
    }
}

def appcompat_version = "1.3.1"

dependencies {
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation 'androidx.annotation:annotation:1.2.0'
    testImplementation 'junit:junit:4.13'
}
