name: Publish App Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.1)'
        required: true
        default: 'v1.0.0'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Compile Release Binary
      run: ./gradlew clean assembleDebug --no-daemon

    - name: Create Official Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: "Volume Control - Clear Layout (${{ github.event.inputs.version_tag }})"
        body: |
          Minimalist compilation.
          - Stripped lower 'Manage' layout buttons.
          - Suppression vectors applied to header categories.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
